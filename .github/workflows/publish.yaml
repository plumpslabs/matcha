name: Publish Package

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (--dry-run)"
        type: boolean
        default: false

jobs:
  # ─── Test + Typecheck ───
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build adapters
        run: pnpm run build

      - name: Verify syntax
        run: |
          for f in hooks/*.js bin/matcha.js; do
            node --check "$f" || exit 1
          done

      - name: Run tests
        run: pnpm exec vitest run --reporter verbose

  # ─── Publish to npmjs.com ───
  publish-npm:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build adapters
        run: pnpm run build

      - name: Ensure NPM_TOKEN is configured
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is NOT set in this repository."
            echo "Fix: npmjs.com → Access Tokens → Generate New Token (Automation) → "
            echo "     GitHub repo → Settings → Secrets and variables → Actions →"
            echo "     New repository secret → name: NPM_TOKEN → paste token."
            echo "Then re-run this workflow (Actions → Publish Package → Run workflow)."
            exit 1
          fi
          echo "NPM_TOKEN is set ✓"

      - name: Publish to npm
        run: |
          FLAGS="--access public --no-git-checks"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          pnpm publish $FLAGS
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─── Publish to GitHub Packages ───
  publish-gpr:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@plumpslabs"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build adapters
        run: pnpm run build

      # Rename package so scope matches GitHub organization (plumpslabs)
      - name: Adapt package name for GitHub Packages
        run: |
          node -e "
            const pkg = JSON.parse(require('fs').readFileSync('package.json','utf8'));
            pkg.name = '@plumpslabs/matcha';
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Publish to GitHub Packages
        run: |
          FLAGS="--no-git-checks"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          pnpm publish $FLAGS
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
